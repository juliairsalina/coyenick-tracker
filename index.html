<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Cats 🐾</title>
  <meta name="description" content="Simple cat care tracker: medication, vaccines, flea & deworming reminders, health records and weight for all your cats.">
  <meta name="theme-color" content="#f59e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Cats">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main" class="app"></main>

  <button id="fab" class="fab" aria-label="Add record">
    <span aria-hidden="true">+</span><span class="fab-label">Add Record</span>
  </button>

  <nav class="tabbar" aria-label="Main">
    <a href="#home" data-tab="home"><span aria-hidden="true">🏠</span>Home</a>
    <a href="#calendar" data-tab="calendar"><span aria-hidden="true">📅</span>Calendar</a>
    <a href="#records" data-tab="records"><span aria-hidden="true">📋</span>Records</a>
    <a href="#cats" data-tab="cats"><span aria-hidden="true">🐱</span>Cats</a>
  </nav>

  <noscript><p style="padding:24px">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
